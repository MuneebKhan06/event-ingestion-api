# Defined once and merged into the services below. The credentials in
# particular are used in two different senses — postgres uses them to
# initialise the database, the app services to connect to it — so they have to
# stay identical; sharing one anchor makes that structural instead of a
# convention someone has to remember.
x-postgres-credentials: &postgres-credentials
  POSTGRES_USER: events_user
  POSTGRES_PASSWORD: events_password
  POSTGRES_DB: events_db

x-app-env: &app-env
  <<: *postgres-credentials
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  LOG_LEVEL: INFO

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: eia-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      # ZooKeeper 3.5+ refuses four-letter commands unless whitelisted, so
      # without this the ruok healthcheck below can never pass — and every
      # service gated on zookeeper being healthy would wait forever.
      # Passed as a JVM option rather than ZOOKEEPER_4LW_COMMANDS_WHITELIST:
      # the image's env-to-property translation silently drops that one, since
      # the property name starts with a digit.
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: eia-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      # Host-facing listener, so tools on the host (locust, kafka CLI) can
      # reach the broker at localhost:9092.
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Two listeners: containers on the compose network use kafka:29092,
      # the host uses localhost:9092. A single listener can't serve both,
      # because the advertised host has to be resolvable by the client.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # Creates the topics explicitly rather than relying on auto-create, which
  # would give them 1 partition. events.raw needs 3 (Decision 2) so up to 3
  # consumers in the group can run in parallel.
  #
  # Deliberately has NO restart policy, unlike every long-running service here.
  # This is a one-shot job whose whole contract is to finish and exit 0;
  # `unless-stopped` would restart it forever and break the
  # service_completed_successfully gate that api and consumer wait on. The
  # inconsistency is the correct behaviour, not an oversight.
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: eia-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    # Note: every line below sits at the same indentation on purpose. YAML's
    # folded scalar only joins lines with spaces when they share an indent —
    # indenting a continuation line would preserve the newline and split the
    # command in half.
    command: >
      bash -c "
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic events.raw --partitions 3 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic events.dlq --partitions 3 --replication-factor 1 &&
      echo 'Topics ready:' &&
      kafka-topics --bootstrap-server kafka:29092 --list
      "

  postgres:
    image: postgres:16-alpine
    container_name: eia-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      <<: *postgres-credentials
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Schema is no longer seeded here. /docker-entrypoint-initdb.d only runs
      # against an empty data directory, so it could create a schema but never
      # change one — see the `migrate` service below.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U events_user -d events_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies schema migrations before anything touches the database. Runs to
  # completion and exits; api and consumer wait on that via
  # service_completed_successfully, so they can never start against a schema
  # that is missing or half-upgraded. `alembic upgrade head` is a no-op when
  # the database is already current, so restarts are harmless.
  #
  # Like kafka-init, no restart policy on purpose — see the note there.
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: eia-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *postgres-credentials
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    command: ["alembic", "upgrade", "head"]

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: eia-api
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      <<: *app-env
    # No healthcheck block here on purpose: it's defined in
    # docker/Dockerfile.api and inherited, so the container is also
    # health-reporting when run outside compose.

  consumer:
    build:
      context: .
      dockerfile: docker/Dockerfile.consumer
    container_name: eia-consumer
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    # The consumer exits deliberately when the database is unreachable (see
    # consumer/main.py) rather than skipping messages. That is only a sound
    # strategy if it comes back, so the restart policy is load-bearing here,
    # not boilerplate.
    restart: unless-stopped
    ports:
      # Prometheus exposition for the consumer process — separate from the
      # API's, because they are separate processes with separate registries.
      - "9100:9100"
    environment:
      <<: *app-env
      KAFKA_CONSUMER_GROUP: event-processors
    # Give the in-flight message time to finish and commit its offset after
    # SIGTERM before Docker escalates to SIGKILL.
    stop_grace_period: 30s

  # Polls public APIs and posts what it finds to the API, giving the stack a
  # continuous supply of real traffic instead of hand-fed test events.
  ingest:
    build:
      context: .
      dockerfile: docker/Dockerfile.ingest
    container_name: eia-ingest
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    ports:
      # Third exposition endpoint, one per process, since each has its own
      # registry: api on 8000, consumer on 9100, ingest here.
      - "9200:9200"
    # Only HTTP settings here. Unlike api and consumer this service never opens
    # a database or Kafka connection, so merging the shared app-env anchor would
    # hand it credentials it has no use for.
    environment:
      INGEST_API_URL: http://api:8000
      INGEST_SOURCES: usgs,weather
      INGEST_INTERVAL_SECONDS: "30"
      INGEST_METRICS_PORT: "9200"
      LOG_LEVEL: INFO

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: eia-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"

volumes:
  postgres_data:
