[tool.ruff]
line-length = 100
# The supported floor, not the version we happen to develop on. CI runs 3.10 as
# well as 3.11, and telling ruff to assume 3.11 made it suggest — and offer to
# auto-apply — idioms that break the 3.10 job.
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # FastAPI's Depends() in argument defaults is the intended idiom
]
